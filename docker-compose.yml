version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: auctionlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: auctionlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auctionlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auctionlens-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/auctionlens?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: auctionlens-production-secret-key-2026
      JWT_REFRESH_SECRET: auctionlens-production-refresh-secret-key-2026
      DATA_PROVIDER: mock
      SCRAPER_ENABLED: "true"
      SCRAPE_INTERVAL_MINUTES: "30"
      FRONTEND_URL: http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auctionlens-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
